name: 보안 점검 문의
description: 코드 보안 점검을 신청합니다. 소스코드·비밀키는 절대 이 이슈에 붙이지 마세요.
title: "[문의] "
labels: ["audit-request"]
body:
  - type: markdown
    attributes:
      value: |
        이 이슈는 **공개**됩니다. 저장소 주소 외 민감 정보는 적지 마세요.
        비공개 저장소는 접수 후 별도 안내드리는 방법으로 읽기 권한을 받습니다.
  - type: input
    id: contact
    attributes:
      label: 연락처 (이메일)
    validations: {required: true}
  - type: dropdown
    id: plan
    attributes:
      label: 희망 플랜
      options: [Scan, Audit, Retainer]
    validations: {required: true}
  - type: input
    id: stack
    attributes:
      label: 주요 언어/프레임워크
  - type: checkboxes
    id: consent
    attributes:
      label: 확인
      options:
        - label: 점검 대상 코드에 대한 소유권 또는 서면 점검 허가가 있습니다.
          required: true

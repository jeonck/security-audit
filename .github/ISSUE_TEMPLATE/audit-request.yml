name: 보안 점검 문의
description: 공개 저장소의 보안 점검을 신청합니다.
title: "[문의] "
labels: ["audit-request"]
body:
  - type: markdown
    attributes:
      value: |
        이 이슈는 **공개**됩니다. 이메일, 소스코드, 비밀키, 토큰은 절대 적지 마세요.
        연락은 이 이슈의 작성자 GitHub 계정과 이슈 코멘트로 드립니다.
        현재는 **공개 저장소만** 접수합니다. 비공개 저장소는 지원하지 않습니다.
  - type: input
    id: repo
    attributes:
      label: 저장소 주소
      description: "예: https://github.com/owner/name"
    validations: {required: true}
  - type: input
    id: ref
    attributes:
      label: 브랜치/태그/커밋 (선택)
      description: 비우면 기본 브랜치를 점검합니다.
  - type: dropdown
    id: plan
    attributes:
      label: 희망 플랜
      options: [Scan, Audit, Retainer]
    validations: {required: true}
  - type: checkboxes
    id: consent
    attributes:
      label: 확인
      options:
        - label: 점검 대상 코드에 대한 소유권 또는 서면 점검 허가가 있습니다.
          required: true

# 운영자 전용: 고객 저장소를 점검하고 리포트를 암호화해 artifact로 남긴다.
# 이 저장소는 공개라 로그/artifact가 노출될 수 있으므로 리포트는 stdout에 찍지 않고 gpg로 암호화한다.
name: Run audit
on:
  workflow_dispatch:
    inputs:
      repo: {description: "대상 저장소 (owner/name)", required: true}
      ref: {description: "브랜치/태그/SHA (비우면 기본 브랜치)", default: ""}
      passphrase: {description: "리포트 암호화 암호 (고객과 별도 전달)", required: true}
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Mask passphrase
        run: echo "::add-mask::${{ inputs.passphrase }}"
      - name: Checkout target (read-only, no persisted creds)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.AUDIT_TARGET_TOKEN || github.token }}
          path: target
          persist-credentials: false
      - name: Checkout skill
        uses: actions/checkout@v4
        with: {path: ops}
      - name: Install skill + Claude Code
        run: |
          mkdir -p target/.claude/skills
          cp -R ops/skill/security-audit target/.claude/skills/
          npm i -g @anthropic-ai/claude-code
      - name: Audit
        working-directory: target
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          OUT="$RUNNER_TEMP/out"; mkdir -p "$OUT"
          claude -p "Use the security-audit skill to run a full security audit of this codebase with the 'standard' profile (never 'quick'). Output directory: $OUT. Run the full six-phase audit with hunter and verifier agents. Do not execute target code or install dependencies. Write REPORT.md, FINDINGS-DETAIL.md and NEEDS-VALIDATION.md in Korean; keep JSON keys, enum values, file paths and code identifiers in English." \
            --allowedTools "Read Grep Glob Write Edit Agent Task Bash(node:*) Bash(git:*) Bash(ls:*) Bash(cat:*) Bash(mkdir:*)" \
            --add-dir "$OUT" > "$RUNNER_TEMP/claude.log" 2>&1 || true
      - name: Encrypt report
        env: {PW: "${{ inputs.passphrase }}"}
        run: |
          tar -C "$RUNNER_TEMP/out" -czf - . | gpg --batch --yes --pinentry-mode loopback --passphrase "$PW" -c -o report.tgz.gpg
      - uses: actions/upload-artifact@v4
        with: {name: report-encrypted, path: report.tgz.gpg, retention-days: 7}
